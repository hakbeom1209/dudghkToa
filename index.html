<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggle Moving Rainbow Text Animation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .rainbow-text {
            font-size: 48px;
            font-weight: bold;
            width: 600px;
            height: 800px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-around;
            align-items: center;
            position: relative;
        }

        .letter {
            transition: color 0.1s, transform 0.3s;
            position: relative;
        }

        .switch-container {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .switch-button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="switch-container">
        <button class="switch-button" id="toggleButton">움직임 켜기</button>
    </div>

    <div class="rainbow-text">
        <span class="letter">정</span>
        <span class="letter">상</span>
        <span class="letter">화</span>
        <span class="letter">는</span>
        <span class="letter">&nbsp;</span>
        <span class="letter">대</span>
        <span class="letter">로</span>
        <span class="letter">틀</span>
    </div>

    <script>
        const colors = ["red", "orange", "yellow", "green", "blue", "indigo", "violet"];
        const letters = document.querySelectorAll('.letter');
        let colorIndex = 0;
        let isMoving = false;
        let moveIntervalId;

        setInterval(() => {
            letters.forEach((letter, index) => {
                letter.style.color = colors[(colorIndex + index) % colors.length];
            });
            colorIndex = (colorIndex + 1) % colors.length;
        }, 100);

        function setRandomPosition(element) {
            const container = document.querySelector('.rainbow-text');
            const maxX = container.clientWidth - element.offsetWidth;
            const maxY = container.clientHeight - element.offsetHeight;
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;
            element.style.position = 'absolute';
            element.style.left = `${randomX}px`;
            element.style.top = `${randomY}px`;
        }

        function startMoving() {
            moveIntervalId = setInterval(() => {
                letters.forEach(letter => setRandomPosition(letter));
            }, 100);
        }

        function stopMoving() {
            clearInterval(moveIntervalId);
            letters.forEach(letter => {
                letter.style.position = 'relative';
                letter.style.left = '0';
                letter.style.top = '0';
            });
        }

        document.getElementById('toggleButton').addEventListener('click', () => {
            isMoving = !isMoving;
            if (isMoving) {
                startMoving();
                toggleButton.textContent = '움직임 끄기';
            } else {
                stopMoving();
                toggleButton.textContent = '움직임 켜기';
            }
        });

        stopMoving();
    </script>

</body>
</html>
